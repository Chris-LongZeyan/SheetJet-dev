name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      - run: python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
      - run: python -m ruff check src tests benchmarks examples
      - run: python -m ruff format --check src tests benchmarks examples
      - run: python -m examples.demo --rows 1000
      - run: python -m examples.multisheet
      - run: python -m examples.reconcile --rows 1000 --output benchmark-output/reconcile-ci
      - run: python -m benchmarks.fixtures benchmark-output/ci --rows 100
